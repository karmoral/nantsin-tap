<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Catálogo | Nantsin</title>

    <meta
        name="description"
        content="Catálogo de productos Nantsin"
    >

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f7f4ed;
            color: #333;
        }

        /* =========================
           ENCABEZADO
        ========================= */

        header {
            background: #ffffff;
            border-bottom: 1px solid #ddd;
            padding: 25px 20px;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 32px;
            font-weight: bold;
            color: #4f6f3f;
            margin-bottom: 5px;
        }

        .subtitle {
            color: #777;
            font-size: 15px;
        }

        /* =========================
           CONTENEDOR
        ========================= */

        .container {
            width: 92%;
            max-width: 1300px;
            margin: 30px auto;
        }

        /* =========================
           BUSCADOR
        ========================= */

        .search-container {
            margin-bottom: 20px;
        }

        #search {
            width: 100%;
            padding: 15px 18px;
            border: 1px solid #ccc;
            border-radius: 12px;
            font-size: 16px;
            outline: none;
            background: white;
        }

        #search:focus {
            border-color: #6d8f58;
            box-shadow: 0 0 0 3px rgba(109, 143, 88, 0.12);
        }

        /* =========================
           CATEGORÍAS
        ========================= */

        .categories {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 10px;
            margin-bottom: 25px;
        }

        .category-btn {
            border: none;
            background: white;
            color: #4f6f3f;
            border: 1px solid #d7d7d7;
            padding: 10px 18px;
            border-radius: 25px;
            cursor: pointer;
            white-space: nowrap;
            font-size: 14px;
        }

        .category-btn:hover,
        .category-btn.active {
            background: #4f6f3f;
            color: white;
        }

        /* =========================
           CONTADOR
        ========================= */

        .results-info {
            margin-bottom: 20px;
            color: #666;
            font-size: 14px;
        }

        /* =========================
           PRODUCTOS
        ========================= */

        #products {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 22px;
        }

        .product-card {
            background: white;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 3px 15px rgba(0,0,0,0.08);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            display: flex;
            flex-direction: column;
        }

        .product-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.12);
        }

        .product-image-container {
            width: 100%;
            height: 240px;
            background: #f1eee6;
            overflow: hidden;
        }

        .product-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .no-image {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #999;
            font-size: 14px;
        }

        .product-info {
            padding: 18px;
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .product-category {
            font-size: 12px;
            color: #6d8f58;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 7px;
        }

        .product-title {
            font-size: 18px;
            line-height: 1.3;
            margin-bottom: 10px;
            color: #333;
        }

        .product-description {
            font-size: 14px;
            line-height: 1.5;
            color: #666;
            margin-bottom: 15px;

            display: -webkit-box;
            -webkit-line-clamp: 4;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .product-bottom {
            margin-top: auto;
        }

        .product-price {
            font-size: 21px;
            font-weight: bold;
            color: #4f6f3f;
            margin-bottom: 12px;
        }

        .whatsapp-btn {
            display: block;
            width: 100%;
            padding: 12px;
            background: #25D366;
            color: white;
            text-align: center;
            text-decoration: none;
            border-radius: 10px;
            font-weight: bold;
            transition: background 0.2s ease;
        }

        .whatsapp-btn:hover {
            background: #1ebe5d;
        }

        /* =========================
           CARGANDO
        ========================= */

        #loading {
            text-align: center;
            padding: 60px 20px;
            color: #777;
            font-size: 18px;
        }

        /* =========================
           SIN RESULTADOS
        ========================= */

        #no-results {
            display: none;
            text-align: center;
            padding: 60px 20px;
            color: #777;
        }

        /* =========================
           MODAL
        ========================= */

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.65);
            padding: 20px;
            overflow-y: auto;
        }

        .modal-content {
            background: white;
            width: 100%;
            max-width: 900px;
            margin: 40px auto;
            border-radius: 18px;
            overflow: hidden;
            position: relative;
        }

        .close-modal {
            position: absolute;
            right: 15px;
            top: 10px;
            width: 40px;
            height: 40px;
            border: none;
            border-radius: 50%;
            background: rgba(0,0,0,0.6);
            color: white;
            font-size: 25px;
            cursor: pointer;
            z-index: 5;
        }

        .modal-body {
            display: grid;
            grid-template-columns: 1fr 1fr;
        }

        .modal-image {
            width: 100%;
            min-height: 400px;
            object-fit: cover;
        }

        .modal-info {
            padding: 35px;
        }

        .modal-category {
            color: #6d8f58;
            font-weight: bold;
            font-size: 13px;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .modal-title {
            font-size: 30px;
            margin-bottom: 15px;
            line-height: 1.2;
        }

        .modal-price {
            color: #4f6f3f;
            font-size: 27px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .modal-description {
            color: #555;
            line-height: 1.6;
            font-size: 15px;
            margin-bottom: 25px;
        }

        .modal-description p {
            margin-bottom: 10px;
        }

        .modal-description ul {
            margin-left: 20px;
            margin-bottom: 15px;
        }

        .modal-whatsapp {
            display: block;
            width: 100%;
            background: #25D366;
            color: white;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            text-decoration: none;
            font-weight: bold;
            font-size: 16px;
        }

        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 1100px) {

            #products {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (max-width: 800px) {

            #products {
                grid-template-columns: repeat(2, 1fr);
            }

            .modal-body {
                grid-template-columns: 1fr;
            }

            .modal-image {
                min-height: 280px;
                max-height: 400px;
            }

            .modal-info {
                padding: 25px;
            }
        }

        @media (max-width: 520px) {

            header {
                padding: 18px 15px;
            }

            .logo {
                font-size: 26px;
            }

            .container {
                width: 94%;
                margin: 20px auto;
            }

            #products {
                grid-template-columns: 1fr;
            }

            .product-image-container {
                height: 270px;
            }

            .modal {
                padding: 10px;
            }

            .modal-content {
                margin: 20px auto;
            }

            .modal-title {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

    <!-- =========================
         ENCABEZADO
    ========================== -->

    <header>

        <div class="logo">
            Nantsin
        </div>

        <div class="subtitle">
            Catálogo de productos
        </div>

    </header>


    <!-- =========================
         CONTENIDO
    ========================== -->

    <main class="container">

        <!-- BUSCADOR -->

        <div class="search-container">

            <input
                type="search"
                id="search"
                placeholder="🔎 Buscar productos..."
                autocomplete="off"
            >

        </div>


        <!-- CATEGORÍAS -->

        <div
            class="categories"
            id="categories"
        >

            <button
                class="category-btn active"
                data-category="all"
            >
                Todos
            </button>

        </div>


        <!-- INFORMACIÓN -->

        <div
            class="results-info"
            id="results-info"
        >
            Cargando productos...
        </div>


        <!-- CARGANDO -->

        <div id="loading">
            Cargando catálogo...
        </div>


        <!-- PRODUCTOS -->

        <div
            id="products"
            style="display:none;"
        >
        </div>


        <!-- SIN RESULTADOS -->

        <div id="no-results">

            <h2>No encontramos productos</h2>

            <p>
                Intenta con otra palabra o categoría.
            </p>

        </div>

    </main>


    <!-- =========================
         MODAL PRODUCTO
    ========================== -->

    <div
        class="modal"
        id="product-modal"
    >

        <div class="modal-content">

            <button
                class="close-modal"
                id="close-modal"
                aria-label="Cerrar"
            >
                ×
            </button>

            <div class="modal-body">

                <img
                    id="modal-image"
                    class="modal-image"
                    src=""
                    alt=""
                >

                <div class="modal-info">

                    <div
                        id="modal-category"
                        class="modal-category"
                    >
                    </div>

                    <h2
                        id="modal-title"
                        class="modal-title"
                    >
                    </h2>

                    <div
                        id="modal-price"
                        class="modal-price"
                    >
                    </div>

                    <div
                        id="modal-description"
                        class="modal-description"
                    >
                    </div>

                    <a
                        id="modal-whatsapp"
                        class="modal-whatsapp"
                        href="#"
                        target="_blank"
                    >
                        💬 Consultar por WhatsApp
                    </a>

                </div>

            </div>

        </div>

    </div>


    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script>

        /*
        ========================================
        CONFIGURACIÓN
        ========================================
        */

        const CSV_FILE = "products_export_1.csv";

        const WHATSAPP_NUMBER = "525584038535";


        /*
        ========================================
        VARIABLES
        ========================================
        */

        let products = [];

        let filteredProducts = [];

        let currentCategory = "all";


        /*
        ========================================
        ELEMENTOS HTML
        ========================================
        */

        const productsContainer =
            document.getElementById("products");

        const loading =
            document.getElementById("loading");

        const noResults =
            document.getElementById("no-results");

        const resultsInfo =
            document.getElementById("results-info");

        const searchInput =
            document.getElementById("search");

        const categoriesContainer =
            document.getElementById("categories");

        const modal =
            document.getElementById("product-modal");

        const closeModal =
            document.getElementById("close-modal");


        /*
        ========================================
        CARGAR CSV
        ========================================
        */

        async function loadCSV() {

            try {

                const response =
                    await fetch(CSV_FILE);

                if (!response.ok) {

                    throw new Error(
                        "No se pudo cargar el CSV"
                    );

                }

                const csvText =
                    await response.text();

                products =
                    parseCSV(csvText);

                /*
                Eliminar productos duplicados
                que Shopify genera por las imágenes
                adicionales.
                */

                products =
                    removeDuplicates(products);

                /*
                Solo productos activos
                y publicados.
                */

                products =
                    products.filter(product => {

                        const status =
                            String(product.Status || "")
                                .toLowerCase()
                                .trim();

                        const published =
                            String(product.Published || "")
                                .toLowerCase()
                                .trim();

                        return (
                            status === "active" &&
                            published === "true"
                        );

                    });


                filteredProducts =
                    [...products];


                createCategories();

                renderProducts();

                loading.style.display =
                    "none";

                productsContainer.style.display =
                    "grid";

            }

            catch (error) {

                console.error(error);

                loading.innerHTML = `
                    <p>
                        ❌ No se pudo cargar el catálogo.
                    </p>

                    <p style="font-size:14px;margin-top:10px;">
                        Verifica que
                        <strong>products_export_1.csv</strong>
                        esté en la misma carpeta que
                        <strong>catalog.html</strong>.
                    </p>
                `;

            }

        }


        /*
        ========================================
        PARSER CSV
        ========================================
        */

        function parseCSV(text) {

            const rows = [];

            let row = [];

            let value = "";

            let insideQuotes = false;


            for (let i = 0; i < text.length; i++) {

                const char = text[i];

                const nextChar =
                    text[i + 1];


                /*
                Comillas
                */

                if (char === '"') {

                    if (
                        insideQuotes &&
                        nextChar === '"'
                    ) {

                        value += '"';

                        i++;

                    }

                    else {

                        insideQuotes =
                            !insideQuotes;

                    }

                }


                /*
                Coma
                */

                else if (
                    char === "," &&
                    !insideQuotes
                ) {

                    row.push(value);

                    value = "";

                }


                /*
                Salto de línea
                */

                else if (
                    (char === "\n" || char === "\r") &&
                    !insideQuotes
                ) {

                    if (
                        char === "\r" &&
                        nextChar === "\n"
                    ) {

                        i++;

                    }

                    row.push(value);

                    value = "";

                    if (row.length > 1) {

                        rows.push(row);

                    }

                    row = [];

                }


                else {

                    value += char;

                }

            }


            /*
            Última fila
            */

            if (value.length > 0 || row.length > 0) {

                row.push(value);

                rows.push(row);

            }


            if (rows.length === 0) {

                return [];

            }


            /*
            Primera fila = encabezados
            */

            const headers =
                rows[0].map(header =>
                    header.trim()
                );


            /*
            Convertir filas a objetos
            */

            return rows
                .slice(1)
                .map(row => {

                    const product = {};

                    headers.forEach(
                        (header, index) => {

                            product[header] =
                                row[index] || "";

                        }
                    );

                    return product;

                });

        }


        /*
        ========================================
        ELIMINAR DUPLICADOS
        ========================================
        */

        function removeDuplicates(list) {

            const unique = new Map();


            list.forEach(product => {

                const handle =
                    product.Handle;

                if (!handle) {

                    return;

                }


                /*
                Si ya existe el producto,
                conservamos la primera imagen.
                */

                if (!unique.has(handle)) {

                    unique.set(
                        handle,
                        product
                    );

                }

            });


            return Array.from(
                unique.values()
            );

        }


        /*
        ========================================
        CATEGORÍAS
        ========================================
        

        function createCategories() {

            const categorySet =
                new Set();


            products.forEach(product => {

                const category =
                    product["Product Category"];

                if (category) {

                    categorySet.add(
                        category.trim()
                    );

                }

            });


            Array.from(categorySet)
                .sort()
                .forEach(category => {

                    const button =
                        document.createElement("button");

                    button.className =
                        "category-btn";

                    button.dataset.category =
                        category;

                    button.textContent =
                        category;

                    categoriesContainer
                        .appendChild(button);

                });


            /*
            Eventos
            

            document
                .querySelectorAll(".category-btn")
                .forEach(button => {

                    button.addEventListener(
                        "click",
                        () => {

                            document
                                .querySelectorAll(
                                    ".category-btn"
                                )
                                .forEach(btn =>
                                    btn.classList.remove(
                                        "active"
                                    )
                                );


                            button.classList.add(
                                "active"
                            );


                            currentCategory =
                                button.dataset.category;


                            filterProducts();

                        }
                    );

                });

        }
        */

function createCategories() {

    const categorySet = new Set();

    products.forEach(product => {

        const category =
            product["Product Category"];

        if (category) {

            categorySet.add(
                category.trim()
            );

        }

    });

    const categories =
        Array.from(categorySet);

    // Tomar solamente la última categoría
    const lastCategory =
        categories[categories.length - 1];

    if (lastCategory) {

        const button =
            document.createElement("button");

        button.className =
            "category-btn";

        button.dataset.category =
            lastCategory;

        button.textContent =
            lastCategory;

        categoriesContainer
            .appendChild(button);
    }

    // Eventos
    document
        .querySelectorAll(".category-btn")
        .forEach(button => {

            button.addEventListener(
                "click",
                () => {

                    document
                        .querySelectorAll(
                            ".category-btn"
                        )
                        .forEach(btn =>
                            btn.classList.remove(
                                "active"
                            )
                        );

                    button.classList.add(
                        "active"
                    );

                    currentCategory =
                        button.dataset.category;

                    filterProducts();

                }
            );

        });

}
        /*
        ========================================
        FILTRAR PRODUCTOS
        ========================================
        */

        function filterProducts() {

            const search =
                searchInput.value
                    .toLowerCase()
                    .trim();


            filteredProducts =
                products.filter(product => {

                    const title =
                        String(
                            product.Title || ""
                        ).toLowerCase();


                    const description =
                        String(
                            product["Body (HTML)"] || ""
                        ).toLowerCase();


                    const category =
                        String(
                            product["Product Category"] || ""
                        ).toLowerCase();


                    /*
                    Buscar
                    */

                    const matchesSearch =
                        !search ||
                        title.includes(search) ||
                        description.includes(search) ||
                        category.includes(search);


                    /*
                    Categoría
                    */

                    const matchesCategory =
                        currentCategory === "all" ||
                        product["Product Category"] ===
                        currentCategory;


                    return (
                        matchesSearch &&
                        matchesCategory
                    );

                });


            renderProducts();

        }


        /*
        ========================================
        BUSCADOR
        ========================================
        */

        searchInput.addEventListener(
            "input",
            filterProducts
        );


        /*
        ========================================
        MOSTRAR PRODUCTOS
        ========================================
        */

        function renderProducts() {

            productsContainer.innerHTML = "";


            resultsInfo.textContent =
                `${filteredProducts.length} producto${
                    filteredProducts.length !== 1
                        ? "s"
                        : ""
                }`;


            if (
                filteredProducts.length === 0
            ) {

                noResults.style.display =
                    "block";

                productsContainer.style.display =
                    "none";

                return;

            }


            noResults.style.display =
                "none";

            productsContainer.style.display =
                "grid";


            filteredProducts.forEach(
                (product, index) => {

                    const card =
                        createProductCard(
                            product,
                            index
                        );

                    productsContainer
                        .appendChild(card);

                }
            );

        }


        /*
        ========================================
        CREAR TARJETA
        ========================================
        */

        function createProductCard(
            product,
            index
        ) {

            const card =
                document.createElement("article");

            card.className =
                "product-card";


            /*
            Datos
            */

            const title =
                product.Title ||
                "Producto sin nombre";


            const category =
                product["Product Category"] ||
                "";


            const description =
                cleanDescription(
                    product["Body (HTML)"] ||
                    ""
                );


            const image =
                product["Image Src"] ||
                "";


            const price =
                product["Variant Price"];


            /*
            Imagen
            */

            let imageHTML = "";

            if (image) {

                imageHTML = `
                    <img
                        class="product-image"
                        src="${escapeHTML(image)}"
                        alt="${escapeHTML(title)}"
                        loading="lazy"
                        onerror="this.parentElement.innerHTML='<div class=&quot;no-image&quot;>Sin imagen</div>'"
                    >
                `;

            }

            else {

                imageHTML = `
                    <div class="no-image">
                        Sin imagen
                    </div>
                `;

            }


            /*
            Precio
            */

            let priceHTML = "";

            if (price) {

                priceHTML =
                    formatPrice(price);

            }
            else {

                priceHTML =
                    "Consultar";

            }


            /*
            WhatsApp
            */

            const whatsappMessage =
                `Hola, me interesa el producto: ${title}`;


            const whatsappURL =
                `https://wa.me/${WHATSAPP_NUMBER}?text=${
                    encodeURIComponent(
                        whatsappMessage
                    )
                }`;


            /*
            HTML
            */

            card.innerHTML = `

                <div
                    class="product-image-container"
                >

                    ${imageHTML}

                </div>


                <div class="product-info">

                    ${
                        category
                        ? `
                            <div class="product-category">
                                ${escapeHTML(category)}
                            </div>
                        `
                        : ""
                    }


                    <h2 class="product-title">
                        ${escapeHTML(title)}
                    </h2>


                    ${
                        description
                        ? `
                            <div class="product-description">
                                ${escapeHTML(description)}
                            </div>
                        `
                        : ""
                    }


                    <div class="product-bottom">

                        <div class="product-price">
                            ${priceHTML}
                        </div>


                        <a
                            href="${whatsappURL}"
                            target="_blank"
                            class="whatsapp-btn"
                        >
                            💬 Consultar
                        </a>

                    </div>

                </div>

            `;


            /*
            Abrir detalle
            al hacer clic en la tarjeta
            */

            card.addEventListener(
                "click",
                function(event) {

                    /*
                    Si hizo clic en WhatsApp,
                    no abrir modal.
                    */

                    if (
                        event.target.closest(
                            ".whatsapp-btn"
                        )
                    ) {

                        return;

                    }


                    openModal(product);

                }
            );


            return card;

        }


        /*
        ========================================
        MODAL
        ========================================
        */

        function openModal(product) {

            const title =
                product.Title ||
                "Producto";


            const category =
                product["Product Category"] ||
                "";


            const image =
                product["Image Src"] ||
                "";


            const price =
                product["Variant Price"];


            const description =
                product["Body (HTML)"] ||
                "";


            /*
            Datos
            */

            document.getElementById(
                "modal-title"
            ).textContent =
                title;


            document.getElementById(
                "modal-category"
            ).textContent =
                category;


            document.getElementById(
                "modal-price"
            ).textContent =
                price
                    ? formatPrice(price)
                    : "Consultar";


            /*
            Descripción

            Aquí sí permitimos el HTML
            proveniente del CSV porque
            viene de Body (HTML).
            */

            document.getElementById(
                "modal-description"
            ).innerHTML =
                sanitizeHTML(description);


            /*
            Imagen
            */

            const modalImage =
                document.getElementById(
                    "modal-image"
                );


            if (image) {

                modalImage.src =
                    image;

                modalImage.alt =
                    title;

                modalImage.style.display =
                    "block";

            }

            else {

                modalImage.style.display =
                    "none";

            }


            /*
            WhatsApp
            */

            const message =
                `Hola, me interesa el producto: ${title}`;


            document.getElementById(
                "modal-whatsapp"
            ).href =
                `https://wa.me/${WHATSAPP_NUMBER}?text=${
                    encodeURIComponent(message)
                }`;


            /*
            Mostrar
            */

            modal.style.display =
                "block";


            document.body.style.overflow =
                "hidden";

        }


        /*
        ========================================
        CERRAR MODAL
        ========================================
        */

        function closeProductModal() {

            modal.style.display =
                "none";

            document.body.style.overflow =
                "";

        }


        closeModal.addEventListener(
            "click",
            closeProductModal
        );


        modal.addEventListener(
            "click",
            function(event) {

                if (
                    event.target === modal
                ) {

                    closeProductModal();

                }

            }
        );


        document.addEventListener(
            "keydown",
            function(event) {

                if (
                    event.key === "Escape"
                ) {

                    closeProductModal();

                }

            }
        );


        /*
        ========================================
        LIMPIAR DESCRIPCIÓN
        ========================================
        */

        function cleanDescription(html) {

            const temporary =
                document.createElement("div");

            temporary.innerHTML =
                html;


            return (
                temporary.textContent ||
                temporary.innerText ||
                ""
            )
                .replace(/\s+/g, " ")
                .trim();

        }


        /*
        ========================================
        FORMATEAR PRECIO
        ========================================
        */

        function formatPrice(price) {

            const number =
                Number(
                    String(price)
                        .replace(/,/g, "")
                );


            if (
                Number.isNaN(number)
            ) {

                return `$${price}`;

            }


            return number.toLocaleString(
                "es-MX",
                {
                    style: "currency",
                    currency: "MXN"
                }
            );

        }


        /*
        ========================================
        ESCAPAR HTML
        ========================================
        */

        function escapeHTML(value) {

            return String(value)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");

        }


        /*
        ========================================
        SANITIZAR HTML
        ========================================
        */

        function sanitizeHTML(html) {

            const temporary =
                document.createElement("div");

            temporary.innerHTML =
                html;


            /*
            Eliminar elementos peligrosos
            */

            temporary
                .querySelectorAll(
                    "script, iframe, object, embed, style"
                )
                .forEach(element =>
                    element.remove()
                );


            /*
            Eliminar atributos peligrosos
            */

            temporary
                .querySelectorAll("*")
                .forEach(element => {

                    Array.from(
                        element.attributes
                    ).forEach(attribute => {

                        if (
                            attribute.name
                                .toLowerCase()
                                .startsWith("on")
                        ) {

                            element.removeAttribute(
                                attribute.name
                            );

                        }

                    });

                });


            return temporary.innerHTML;

        }


        /*
        ========================================
        INICIAR CATÁLOGO
        ========================================
        */

        loadCSV();

    </script>

</body>
